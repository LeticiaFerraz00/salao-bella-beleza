name: Testes automatizados

on:
  push:
    branches: [main, melhoria-validacao-servicos]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Executar testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pytest pytest-cov

      - name: Verificar sintaxe do codigo
        run: python -m compileall -q app.py database.py

      - name: Executar testes e medir cobertura
        run: python -m pytest tests/ -v --cov=app --cov=database --cov-report=term-missing