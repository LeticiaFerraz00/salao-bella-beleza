<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | Salão Bella Beleza</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff7f8;
            color: #49343b;
        }

        header {
            background-color: #7d3049;
            color: white;
            padding: 24px 8%;
        }

        header h1 { margin: 0; }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .card {
            background-color: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 18px #7d304915;
        }

        h2 { color: #7d3049; }

        label {
            display: block;
            margin: 15px 0 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8bfc7;
            border-radius: 8px;
        }

        button {
            margin-top: 20px;
            background-color: #7d3049;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 22px;
            cursor: pointer;
        }

        button:hover { background-color: #602238; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0dce2;
        }

        a { color: #7d3049; }
  /* Modo de alto contraste */
body.alto-contraste {
    background-color: #000 !important;
    color: #fff !important;
}

body.alto-contraste header,
body.alto-contraste main,
body.alto-contraste .card {
    background-color: #000 !important;
    color: #fff !important;
    border-color: #ff0 !important;
    box-shadow: none !important;
}

body.alto-contraste h1,
body.alto-contraste h2,
body.alto-contraste p,
body.alto-contraste label,
body.alto-contraste th,
body.alto-contraste td {
    color: #fff !important;
}

body.alto-contraste input {
    background-color: #000 !important;
    color: #fff !important;
    border: 2px solid #ff0 !important;
}

body.alto-contraste button {
    background-color: #ff0 !important;
    color: #000 !important;
    border: 2px solid #fff !important;
}

body.alto-contraste a {
    color: #ff0 !important;
}

body.alto-contraste th,
body.alto-contraste td {
    border-bottom: 1px solid #ff0 !important;
}

body.alto-contraste input:focus-visible,
body.alto-contraste button:focus-visible,
body.alto-contraste a:focus-visible {
    outline: 3px solid #ff0;
    outline-offset: 3px;
}
    </style>
</head>

<body>
    <header>
 <header>
    <h1>Salão Bella Beleza</h1>
    <p>Cadastro de clientes</p>

    <button type="button" id="botao-contraste" aria-pressed="false">
        Ativar alto contraste
    </button>
 </header>

</header>
    </header>

    <main>
        <p><a href="/">← Voltar para o início</a></p>

        <section class="card">
            <h2>Cadastrar cliente</h2>

            <form method="POST">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required>

                <button type="submit">Cadastrar cliente</button>
            </form>
        </section>

        <section class="card">
            <h2>Clientes cadastrados</h2>

            {% if clientes %}
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for cliente in clientes %}
                        <tr>
                            <td>{{ cliente["nome"] }}</td>
                            <td>{{ cliente["telefone"] }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <p>Nenhum cliente cadastrado ainda.</p>
            {% endif %}
        </section>
    </main>
   <script>
    const botaoContraste = document.getElementById("botao-contraste");

    function atualizarContraste(ativado) {
        document.body.classList.toggle("alto-contraste", ativado);

        botaoContraste.setAttribute("aria-pressed", String(ativado));

        botaoContraste.textContent = ativado
            ? "Desativar alto contraste"
            : "Ativar alto contraste";
    }

    // Recupera a preferência salva no navegador
    atualizarContraste(localStorage.getItem("altoContraste") === "true");

    botaoContraste.addEventListener("click", function () {
        const ativado = !document.body.classList.contains("alto-contraste");

        atualizarContraste(ativado);
        localStorage.setItem("altoContraste", String(ativado));
    });
</script> 
</body>
</html>
